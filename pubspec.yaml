name: sinav_ligi_app
description: "Bilgi Rotası - Sınav Hazırlık Uygulaması"
publish_to: 'none'
version: 1.0.5+48

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_html: ^3.0.0-alpha.6

  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2

  google_mobile_ads: ^5.1.0
  app_tracking_transparency: ^2.0.6

  audioplayers: ^6.1.0

  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+10
  in_app_purchase_platform_interface: ^1.4.0

  excel: ^4.0.6
  http: ^1.3.0
  path_provider: ^2.1.5
  share_plus: ^13.1.0

  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  shared_preferences: ^2.0.0

  connectivity_plus: ^7.1.1
  home_widget: 0.7.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#06092B"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#06092B"
  image: "assets/images/logo.png"
  android: true
  ios: false
  fullscreen: true
  android_12:
    color: "#06092B"
    image: "assets/images/logo.png"

flutter:
  uses-material-design: true

  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/icons/
    - assets/sounds/

    - assets/pdfs/tarih_kpss.pdf
    - assets/pdfs/cografya_kpss.pdf
    - assets/pdfs/ayt_edebiyat.pdf
    - assets/pdfs/ayt_biyoloji.pdf
    - assets/pdfs/tyt_biyoloji.pdf
    - assets/pdfs/felsefe.pdf

    - assets/denemeler/
    - assets/denemeler/tyt_deneme/
    - assets/denemeler/ayt_sayisal_deneme/
    - assets/denemeler/ayt_esitagirlik_deneme/
    - assets/denemeler/sozel_deneme/
    - assets/denemeler/kpss_lisans/
    - assets/denemeler/kpss_önlisans/

    - assets/mini_denemeler/

    - assets/tyt_turkce/
    - assets/tyt_matematik/
    - assets/tyt_tarih/
    - assets/tyt_cografya/
    - assets/tyt_felsefe/
    - assets/tyt_din/
    - assets/tyt_biyoloji/
    - assets/tyt_fizik/
    - assets/tyt_kimya/

    - assets/ayt_sayisal_matematik/
    - assets/ayt_sayisal_fizik/
    - assets/ayt_sayisal_kimya/
    - assets/ayt_sayisal_biyoloji/

    - assets/ayt_esitagirlik_matematik/
    - assets/ayt_esitagirlik_edebiyat/
    - assets/ayt_esitagirlik_tarih/
    - assets/ayt_esitagirlik_cografya/

    - assets/ayt_sozel_felsefe/
    - assets/ayt_sozel_din/

    - assets/kpss_lisans_turkce/
    - assets/kpss_lisans_matematik/
    - assets/kpss_lisans_tarih/
    - assets/kpss_lisans_cografya/
    - assets/kpss_lisans_vatandaslik/

    - assets/kpss_onlisans_turkce/
    - assets/kpss_onlisans_matematik/
    - assets/kpss_onlisans_tarih/
    - assets/kpss_onlisans_cografya/
    - assets/kpss_onlisans_vatandaslik/
